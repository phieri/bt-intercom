[package]
name = "rpi-intercom"
version = "0.1.0"
edition = "2024"
description = "A full-duplex Bluetooth headset intercom for Raspberry Pi"
repository = "https://github.com/phieri/rpi-intercom"
readme = "README.md"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.7"
ctrlc = { version = "3.5.2", features = ["termination"] }
env_logger = "0.11.11"
libc = "0.2.189"
log = "0.4.34"
serde_json = "1.0.151"

[package.metadata.deb]
section = "utils"
priority = "optional"
depends = "libc6, libgcc-s1, bluez, pipewire, pipewire-bin, wireplumber, libspa-0.2-bluetooth"
assets = [
    "$auto",
    ["packaging/rpi-intercom.service", "usr/lib/systemd/user/", "644"],
    ["man/rpi-intercom.1", "usr/share/man/man1/", "644"],
]

[package.metadata.generate-rpm]
license = "LicenseRef-Unknown"
assets = [
    { source = "target/release/rpi-intercom", dest = "/usr/bin/rpi-intercom", mode = "755" },
    { source = "packaging/rpi-intercom.service", dest = "/usr/lib/systemd/user/rpi-intercom.service", mode = "644" },
    { source = "man/rpi-intercom.1", dest = "/usr/share/man/man1/rpi-intercom.1", mode = "644" },
]

[package.metadata.generate-rpm.requires]
bluez = "*"
pipewire = "*"
pipewire-utils = "*"
wireplumber = "*"
