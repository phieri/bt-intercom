[package]
name = "bt-intercom"
version = "0.1.0"
edition = "2024"
description = "A Bluetooth headset intercom for Linux"
repository = "https://github.com/phieri/bt-intercom"
readme = "README.md"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.7"
crossterm = "0.29.0"
ctrlc = { version = "3.5.2", features = ["termination"] }
env_logger = "0.11.11"
libc = "0.2.189"
log = "0.4.34"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29"] }
rppal = "0.22.1"
serde_json = "1.0.151"

[package.metadata.deb]
section = "utils"
priority = "optional"
depends = "libc6, libgcc-s1, bluez, pipewire, pipewire-bin, wireplumber, libspa-0.2-bluetooth"
assets = [
    "$auto",
    ["packaging/usr.bin.bt-intercom", "etc/apparmor.d/", "644"],
    ["packaging/bt-intercom.service", "usr/lib/systemd/user/", "644"],
    ["man/bt-intercom.1", "usr/share/man/man1/", "644"],
]

[package.metadata.generate-rpm]
license = "LicenseRef-Unknown"
assets = [
    { source = "target/release/bt-intercom", dest = "/usr/bin/bt-intercom", mode = "755" },
    { source = "packaging/usr.bin.bt-intercom", dest = "/etc/apparmor.d/usr.bin.bt-intercom", mode = "644" },
    { source = "packaging/bt-intercom.service", dest = "/usr/lib/systemd/user/bt-intercom.service", mode = "644" },
    { source = "man/bt-intercom.1", dest = "/usr/share/man/man1/bt-intercom.1", mode = "644" },
]

[package.metadata.generate-rpm.requires]
bluez = "*"
pipewire = "*"
pipewire-utils = "*"
wireplumber = "*"
