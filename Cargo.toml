[package]
name = "rpi-intercom"
version = "0.1.0"
edition = "2024"
description = "A full-duplex Bluetooth headset intercom for Raspberry Pi"
repository = "https://github.com/phieri/rpi-intercom"
readme = "README.md"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.7"
ctrlc = { version = "3.5.2", features = ["termination"] }
env_logger = "0.11.11"
libc = "0.2.189"
log = "0.4.34"
serde_json = "1.0.151"

[package.metadata.deb]
section = "utils"
priority = "optional"
depends = "$auto, bluez, pipewire-bin, wireplumber, libspa-0.2-bluetooth"
assets = [
    "$auto",
    ["packaging/rpi-intercom.service", "usr/lib/systemd/user/", "644"],
    ["man/rpi-intercom.1", "usr/share/man/man1/", "644"],
]
