name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - .github/workflows/pages.yml
      - .github/scripts/generate-demo-transcript.py
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - name: Fetch pinned Reveal.js distribution
        uses: actions/checkout@v7
        with:
          repository: hakimel/reveal.js
          ref: 25e52e26af09933a98afb24cfdd3574e9055034d
          path: reveal-source
          sparse-checkout: |
            LICENSE
            dist/reset.css
            dist/reveal.css
            dist/reveal.js
            dist/theme/simple.css
            plugin/notes/notes.js
          sparse-checkout-cone-mode: false
      - name: Prepare Reveal.js assets
        run: |
          mkdir -p docs/vendor/reveal/theme docs/vendor/reveal/plugin/notes
          cp reveal-source/LICENSE docs/vendor/reveal/LICENSE
          cp reveal-source/dist/reset.css reveal-source/dist/reveal.css reveal-source/dist/reveal.js docs/vendor/reveal/
          cp reveal-source/dist/theme/simple.css docs/vendor/reveal/theme/
          cp reveal-source/plugin/notes/notes.js docs/vendor/reveal/plugin/notes/
      - name: Generate accessible demo transcript
        run: python3 .github/scripts/generate-demo-transcript.py
      - name: Download asciinema player
        run: |
          mkdir -p docs/vendor
          gh release download v3.17.0 --repo asciinema/asciinema-player --pattern asciinema-player.css --pattern asciinema-player.min.js --dir docs/vendor
          gh api --header "Accept: application/vnd.github.raw" "repos/asciinema/asciinema-player/contents/LICENSE?ref=v3.17.0" > docs/vendor/LICENSE.asciinema-player
          echo "f619fe17597043564f03b2c6918b3daf890ee8b912fb408542fba11afade4fdb  docs/vendor/asciinema-player.css" | sha256sum -c -
          echo "a13c37632e1b5c49fe9128417b9319a9b5bc64cb457dd5ae52cbba8a3aceb880  docs/vendor/asciinema-player.min.js" | sha256sum -c -
          echo "63422284ed65be54ab38d8a94e7518d27e222fbb26c9ae4cd984c63926e91c12  docs/vendor/LICENSE.asciinema-player" | sha256sum -c -
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v5
